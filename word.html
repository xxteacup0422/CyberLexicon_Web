<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CyberLexicon WEB</title>
        <link rel="stylesheet" href="word-style.css">
        <link rel="icon" href="logo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <script src="word-script.js"></script>
    </head>
    <body>
        <div class="menu-bar">
            <div class="title">
                <img src="logo.png" alt="Logo">
                <h1>CyberLexicon WEB</h1>
            </div>
            <div class="button-list">
                <button id="about-button" class="menu-button">
                    <span class="material-symbols-outlined">info</span>
                    <p>About</p>
                </button>
            </div>
        </div>
        <div class="main">
            <div class="search-input">
                <span class="material-symbols-outlined">search</span>
                <input type="text" placeholder="Search Malay Word...">
                <span class="material-symbols-outlined clear-button">close</span>
            </div>
            <ul class="search-list">
            </ul>
            <div class="dictionary">
                <h1 class="word-name"></h1>
                <div class="word-pronounce"></div>
                <div class="link"></div>
                <h3 class="label-stem">Word Stem:</h3>
                <h1 class="word-stem"></h1>
                <h3 class="show">Word Meaning:</h3>
                <ul class="word-means"></ul>
                <h3 class="label-example">Word Example:</h3>
                <ul class="word-example"></ul>
                <h3 class="label-synonym">Word Synonym:</h3>
                <ul class="word-synonym"></ul>
                <h3 class="label-antonym">Word Antonym:</h3>
                <ul class="word-antonym"></ul>
                <h3 class="label-affix">Word Affix:</h3>
                <ul class="word-affix"></ul>
                <h3 class="label-phrase">Word Phrase:</h3>
                <ul class="word-phrase"></ul>
            </div>
        </div>
    </body>
</html>
