<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CyberLexicon WEB</title>
        <link rel="stylesheet" href="index-style.css">
        <link rel="icon" href="logo.png">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=info" />
        <script src="index-script.js"></script>
    </head>
    <body>
        <div class="main">
            <div class="title">
                <img src="logo.png" alt="">
                <h1>CyberLexicon</h1>
            </div>
            <input type="text" class="search" placeholder="Search Malay Word"/>
            <ol class="search_area">
                <li>mengenal</li>
            </ol>
            <div class="button_area">
                <span class="info_button material-symbols-outlined" onclick="showInfo()">info</span>
            </div>  
        </div>
        <div class="info_area">
            <button onclick="backMain()">Back</button>
            <h2>About</h2>
            <p><strong>CyberLexicon Web</strong> is a Malay Dictionary, add Annontate of English and Chinese Simpifield.</p>
            <p> - Currently only supports Malay Dictionary.</p>
            <a href="https://github.com/xxteacup0422/CyberLexicon_Web">Repositories Github Link</a>
        </div>
    </body>
</html>
