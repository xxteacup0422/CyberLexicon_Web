<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CyberLexicon WEB</title>
        <link rel="stylesheet" href="index-style.css">
        <link rel="icon" href="logo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <script src="index-script.js"></script>
    </head>
    <body>
        <div class="main">
            <div class="title">
                <img src="logo.png" alt="">
                <h1>CyberLexicon</h1>
            </div>
            <input type="text" class="search" placeholder="Search Malay Word"/>
            <ol class="search_area">
            </ol>
            <div class="button_area">
                <span class="info_button material-symbols-outlined notranslate" onclick="showInfo()"></span>
            </div>  
        </div>
        <div class="info_area">
            <span class="backButton material-symbols-outlined notranslate" onclick="backMain()"></span>
            <h2>About</h2>
            <p><strong>CyberLexicon Web</strong> is a Malay Dictionary, add Annontate of English and Chinese Simpifield.</p>
            <p> - Currently only supports Malay Dictionary.</p>
            <p><strong>Version: </strong>0.2-beta</p>
            <a href="https://github.com/xxteacup0422/CyberLexicon_Web">Repositories Github Link</a>
        </div>
        <div class="dictionary_area">
            <span class="backButton material-symbols-outlined notranslate" onclick="backMain()"></span>
            <h2 class="word"></h2>
            <div class="pronounce"></div>
            <h3>Mean:</h3>
            <ol class="means">
            </ol>
            <h3 class="label_example">Example:</h3>
            <ol class="example">
            </ol>
        </div>
        <div class="blackground">
            <div class="abbr-box">
                <span class="backButton material-symbols-outlined notranslate" onclick="removeBox()"></span>
                <h2>Abbreviation</h2>
                <p class="abbr-text"></p>
                <span class="south_arrow material-symbols-outlined"></span>
                <p class="full-text"></p>
            </div>
        </div>
    </body>
</html>
